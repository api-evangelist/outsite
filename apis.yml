aid: outsite
name: Outsite
description: Outsite is a coliving and community platform for remote workers, digital
  nomads, and distributed teams. It operates a global network of fully-furnished coliving
  spaces, curated stays, and cowork cafes across more than twenty destinations including
  Lisbon, Barcelona, Bali, Oaxaca, and Costa Rica, pairing dedicated coworking areas
  and fast WiFi with a built-in community of remote professionals. Outsite sells yearly
  and lifetime memberships, curated month-long Outsite Trips, and team retreat and
  business membership offerings for companies. It was surfaced as a 500 Global portfolio
  company; Outsite is a consumer hospitality and travel brand and publishes no public
  developer API, SDK, or webhook surface at this time.
